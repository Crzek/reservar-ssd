openapi: 3.0.3
info:
  title: Padel Court Booking API
  version: 1.0.0
  description: >
    API REST del sistema de reservas de pádel (spec 001-padel-court-booking).
    Autenticación por cookie de sesión `sid` (HttpOnly, SameSite=Lax), expiración deslizante de
    24 h de inactividad (FR-004a). Fechas `YYYY-MM-DD` y horas 0–23 en hora local del club
    (America/Bogota, UTC−5). Todo error usa el esquema `ErrorResponse` (FR-022, FR-023).
servers:
  - url: /api

tags:
  - name: auth
  - name: courts
  - name: reservations

paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Registrar cuenta e iniciar sesión (FR-001, FR-002, US1-1/2)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '201':
          description: Cuenta creada; se establece la cookie de sesión.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SessionCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '409':
          description: El correo ya está registrado (`EMAIL_TAKEN`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/login:
    post:
      tags: [auth]
      summary: Iniciar sesión (FR-003, FR-003a, US1-3/4/7)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '200':
          description: Sesión iniciada; se establece la cookie de sesión.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SessionCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401':
          description: >
            Credenciales incorrectas (`INVALID_CREDENTIALS`). Mensaje genérico idéntico exista o no
            el correo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: >
            Correo bloqueado 15 min tras 5 fallos consecutivos (`TOO_MANY_ATTEMPTS`). Se responde
            igual exista o no el correo y aunque la contraseña sea correcta.
          headers:
            Retry-After:
              description: Segundos restantes de bloqueo.
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/logout:
    post:
      tags: [auth]
      summary: Cerrar sesión (FR-004, US1-6)
      description: Idempotente; borra la sesión si existe y limpia la cookie.
      responses:
        '204':
          description: Sesión cerrada.

  /auth/me:
    get:
      tags: [auth]
      summary: Usuario de la sesión actual
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Sesión válida.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /courts:
    get:
      tags: [courts]
      summary: Listar las 5 canchas fijas (FR-007, US2-1). Público.
      description: >
        Accesible sin sesión (Assumptions: los visitantes ven la lista, no la grilla). Incluye la
        ventana de reserva vigente para que el cliente pinte el selector de 7 días (FR-008).
      responses:
        '200':
          description: Lista de canchas y ventana de reserva.
          content:
            application/json:
              schema:
                type: object
                required: [courts, bookingWindow]
                properties:
                  courts:
                    type: array
                    minItems: 5
                    maxItems: 5
                    items: { $ref: '#/components/schemas/Court' }
                  bookingWindow: { $ref: '#/components/schemas/BookingWindow' }
              example:
                courts:
                  - { id: 1, name: Cancha Laureles }
                  - { id: 2, name: Cancha El Poblado }
                  - { id: 3, name: Cancha Belén }
                  - { id: 4, name: Cancha Robledo }
                  - { id: 5, name: Cancha Envigado }
                bookingWindow: { from: '2026-10-26', to: '2026-11-01' }

  /courts/{courtId}/availability:
    get:
      tags: [courts]
      summary: Grilla de 24 bloques para una cancha y fecha (FR-008–FR-011, US2-2)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CourtId'
        - name: date
          in: query
          required: true
          schema: { type: string, format: date, example: '2026-10-27' }
      responses:
        '200':
          description: >
            Exactamente 24 bloques ordenados por hora. Nunca incluye datos del usuario que
            reservó (FR-011).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Availability' }
        '400':
          description: >
            Cancha inexistente o fecha mal formada (`INVALID_INPUT`), o fecha fuera de hoy…hoy+6
            (`OUT_OF_BOOKING_WINDOW`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /reservations:
    post:
      tags: [reservations]
      summary: Crear una reserva de 1 bloque (FR-012–FR-017, US2-3..7)
      description: >
        Validación + inserción atómicas en una transacción SQLite `BEGIN IMMEDIATE` con índice
        único parcial como garantía final (Principio I). Tras un 409 el cliente debe volver a
        consultar la disponibilidad (FR-015).
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [courtId, date, startHour]
              additionalProperties: false
              properties:
                courtId: { type: integer, minimum: 1, maximum: 5 }
                date: { type: string, format: date }
                startHour: { type: integer, minimum: 0, maximum: 23 }
            example: { courtId: 3, date: '2026-10-27', startHour: 18 }
      responses:
        '201':
          description: Reserva creada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
        '400':
          description: >
            `INVALID_INPUT` (cancha/fecha/hora inválida), `OUT_OF_BOOKING_WINDOW` (más allá de
            hoy+6), `SLOT_IN_PAST` (fecha pasada o el bloque ya empezó al confirmar).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409':
          description: >
            `SLOT_TAKEN` ("La cancha ya fue reservada en este horario") o
            `ACTIVE_RESERVATION_EXISTS` (el usuario ya tiene una reserva activa).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                slotTaken:
                  value:
                    error:
                      code: SLOT_TAKEN
                      message: La cancha ya fue reservada en este horario.
                activeExists:
                  value:
                    error:
                      code: ACTIVE_RESERVATION_EXISTS
                      message: Ya tienes una reserva activa. Solo se permite una a la vez.

  /reservations/me:
    get:
      tags: [reservations]
      summary: Panel "Mis Reservas" (FR-018, US3-1/2)
      description: >
        `upcoming`: reservas no canceladas cuya hora de fin no ha pasado (futuras y en curso),
        orden ascendente. `history`: reservas no canceladas cuya hora de fin ya pasó, orden
        descendente. Las canceladas no aparecen.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Reservas del usuario de la sesión (solo las propias, FR-021).
          content:
            application/json:
              schema:
                type: object
                required: [upcoming, history]
                properties:
                  upcoming:
                    type: array
                    items: { $ref: '#/components/schemas/Reservation' }
                  history:
                    type: array
                    items: { $ref: '#/components/schemas/Reservation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /reservations/{reservationId}:
    delete:
      tags: [reservations]
      summary: Cancelar una reserva futura propia (FR-019–FR-021, US3-3/5/6)
      description: >
        La confirmación ("¿Seguro?") ocurre en la UI antes de llamar a este endpoint (US3-4).
      security: [{ sessionCookie: [] }]
      parameters:
        - name: reservationId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '204':
          description: Reserva cancelada; el bloque vuelve a estar disponible.
        '400':
          description: >
            `INVALID_INPUT` (id mal formado) o `RESERVATION_NOT_CANCELLABLE` (ya empezó o pasó).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404':
          description: >
            `RESERVATION_NOT_FOUND`: no existe, pertenece a otro usuario o ya fue cancelada (no se
            distingue para no revelar reservas ajenas).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sid

  headers:
    SessionCookie:
      description: '`sid=<token>; HttpOnly; SameSite=Lax; Path=/` (+ `Secure` en producción)'
      schema: { type: string }

  parameters:
    CourtId:
      name: courtId
      in: path
      required: true
      schema: { type: integer, minimum: 1, maximum: 5 }

  responses:
    InvalidInput:
      description: Datos inválidos (`INVALID_INPUT`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthenticated:
      description: Sin sesión o sesión expirada (`UNAUTHENTICATED`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    Credentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8 }

    UserResponse:
      type: object
      required: [user]
      properties:
        user:
          type: object
          required: [id, email]
          properties:
            id: { type: integer }
            email: { type: string }

    Court:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }

    BookingWindow:
      type: object
      description: Fechas reservables, inclusive (hoy … hoy+6, hora del club).
      required: [from, to]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }

    Slot:
      type: object
      required: [startHour, label, status]
      properties:
        startHour: { type: integer, minimum: 0, maximum: 23 }
        label: { type: string, example: '18:00–19:00' }
        status:
          type: string
          enum: [available, reserved, unavailable]
          description: >
            `unavailable` si la hora de inicio ya pasó (incluye el bloque en curso), sin importar
            si estaba reservado (FR-010).

    Availability:
      type: object
      required: [court, date, bookingWindow, slots]
      properties:
        court: { $ref: '#/components/schemas/Court' }
        date: { type: string, format: date }
        bookingWindow: { $ref: '#/components/schemas/BookingWindow' }
        slots:
          type: array
          minItems: 24
          maxItems: 24
          items: { $ref: '#/components/schemas/Slot' }

    Reservation:
      type: object
      required: [id, court, date, startHour, label, cancellable]
      properties:
        id: { type: integer }
        court: { $ref: '#/components/schemas/Court' }
        date: { type: string, format: date }
        startHour: { type: integer, minimum: 0, maximum: 23 }
        label: { type: string, example: '18:00–19:00' }
        cancellable:
          type: boolean
          description: true solo si la hora de inicio no ha llegado (FR-019).

    ErrorCode:
      type: string
      enum:
        - INVALID_INPUT
        - OUT_OF_BOOKING_WINDOW
        - SLOT_IN_PAST
        - RESERVATION_NOT_CANCELLABLE
        - UNAUTHENTICATED
        - INVALID_CREDENTIALS
        - RESERVATION_NOT_FOUND
        - EMAIL_TAKEN
        - SLOT_TAKEN
        - ACTIVE_RESERVATION_EXISTS
        - TOO_MANY_ATTEMPTS
        - INTERNAL

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message:
              type: string
              description: Mensaje en español, comprensible y sin detalles técnicos (FR-022).
